# =============================================================================
# SECURITY FIX – Vulnerability 3 (CWE-200): Nginx Port 80 → 443 Redirect
# =============================================================================
#
# PURPOSE:
#   1. Redirect all HTTP (port 80) traffic to HTTPS (port 443) — including raw
#      IP requests — so the default nginx page is never served on port 80.
#   2. Drop requests arriving at the raw IP address (not via domain name) on
#      port 443 with a 444 (connection drop) to prevent host-header
#      reconnaissance.
#
# DEPLOYMENT INSTRUCTIONS:
#   1. Copy this file to: /etc/nginx/sites-available/barber-app
#   2. Run: ln -sf /etc/nginx/sites-available/barber-app /etc/nginx/sites-enabled/barber-app
#   3. Remove the default site: rm -f /etc/nginx/sites-enabled/default
#   4. Verify: nginx -t
#   5. Reload: systemctl reload nginx
#
# REPLACE the following placeholders before deploying:
#   YOUR_DOMAIN_HERE    → your actual domain, e.g. app.yoursalon.com
#   /var/www/html/public → your Laravel public directory path
#   /path/to/ssl.crt    → your SSL certificate path
#   /path/to/ssl.key    → your SSL private key path
#
# =============================================================================


# ─────────────────────────────────────────────────────────────────────────────
# BLOCK 1: Drop raw IP requests on port 80 (default_server catch-all)
#          This prevents the default nginx page from being served on raw IP.
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # Accept but immediately drop all requests that don't match a named vhost.
    # 444 = nginx-specific code that closes the connection without a response.
    server_name _;
    return 444;
}


# ─────────────────────────────────────────────────────────────────────────────
# BLOCK 2: HTTP → HTTPS permanent redirect for the application domain
#          Redirects all port-80 traffic (including /.well-known/ for Let's
#          Encrypt challenge) to the secure HTTPS equivalent.
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;

    server_name YOUR_DOMAIN_HERE www.YOUR_DOMAIN_HERE;

    # Let's Encrypt ACME challenge (needed for cert renewal)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;   # adjust to your certbot webroot if used
        try_files $uri =404;
    }

    # Permanent redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}


# ─────────────────────────────────────────────────────────────────────────────
# BLOCK 3: Drop raw IP requests on port 443 (default_server catch-all)
#          Prevents host-header reconnaissance via direct IP on HTTPS.
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;

    server_name _;

    # A self-signed or real certificate is required here to terminate TLS.
    # Even a self-signed cert works since we'll be dropping the connection.
    ssl_certificate     /path/to/ssl.crt;
    ssl_certificate_key /path/to/ssl.key;

    return 444;
}


# ─────────────────────────────────────────────────────────────────────────────
# BLOCK 4: Main HTTPS Application Server
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name YOUR_DOMAIN_HERE www.YOUR_DOMAIN_HERE;

    root /var/www/html/public;   # Laravel public directory
    index index.php index.html;

    # ── SSL / TLS Configuration ───────────────────────────────────────────────
    ssl_certificate     /path/to/ssl.crt;
    ssl_certificate_key /path/to/ssl.key;

    # Modern TLS-only (no SSLv3, TLS 1.0, TLS 1.1)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers   'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS – forces browsers to HTTPS for 1 year (enable after confirming HTTPS works)
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # ── Security Headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options           "SAMEORIGIN"  always;
    add_header X-Content-Type-Options    "nosniff"     always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # ── Laravel Routing ───────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── PHP-FPM ───────────────────────────────────────────────────────────────
    location ~ \.php$ {
        include        snippets/fastcgi-php.conf;
        fastcgi_pass   unix:/run/php/php8.2-fpm.sock;   # adjust PHP version
        fastcgi_param  SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include        fastcgi_params;

        # Timeouts for long-running requests (e.g. report generation)
        fastcgi_read_timeout 300;
    }

    # ── Block access to sensitive files ───────────────────────────────────────
    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~ /\.env {
        deny all;
    }

    # ── Caching for static assets ─────────────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires    30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # ── Logging ───────────────────────────────────────────────────────────────
    access_log /var/log/nginx/barber-app.access.log;
    error_log  /var/log/nginx/barber-app.error.log;
}
